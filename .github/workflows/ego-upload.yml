name: Upload to EGO

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install GNOME extension tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell python3-venv

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir dist extension/atmos-vpn@reuben-geonet.github.io

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atmos-gnome-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  shexli:
    name: Shexli static analysis
    runs-on: ubuntu-latest
    needs: pack

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: atmos-gnome-extension
          path: dist

      - name: Install Shexli
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip shexli

      - name: Run Shexli static analysis
        run: |
          . .venv/bin/activate
          shexli dist/*.shell-extension.zip

  release-asset:
    name: Attach GitHub release asset
    runs-on: ubuntu-latest
    needs: [pack, shexli]
    if: github.event_name == 'release'
    permissions:
      contents: write

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: atmos-gnome-extension
          path: dist

      - name: Attach extension ZIP to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" dist/*.shell-extension.zip --clobber

  upload:
    name: Upload to extensions.gnome.org
    runs-on: ubuntu-latest
    needs: [pack, shexli]

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: atmos-gnome-extension
          path: dist

      - name: Upload to extensions.gnome.org
        env:
          EGO_USERNAME: ${{ secrets.EGO_USERNAME }}
          EGO_PASSWORD: ${{ secrets.EGO_PASSWORD }}
        run: |
          test -n "$EGO_USERNAME"
          test -n "$EGO_PASSWORD"
          # ubuntu-latest is currently Ubuntu 24.04 with GNOME Shell 46, which does
          # not include `gnome-extensions upload`. Use a newer pinned Ubuntu image
          # until GitHub-hosted runners provide GNOME Shell 49+ tooling.
          docker run --rm \
            --volume "$PWD/dist:/dist:ro" \
            --env EGO_USERNAME \
            --env EGO_PASSWORD \
            ubuntu:26.04@sha256:f3d28607ddd78734bb7f71f117f3c6706c666b8b76cbff7c9ff6e5718d46ff64 \
            bash -euo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates gnome-shell
              gnome-extensions version
              gnome-extensions help upload
              password_file="$(mktemp)"
              printf "%s" "$EGO_PASSWORD" > "$password_file"
              chmod 600 "$password_file"
              gnome-extensions upload --accept-tos --user "$EGO_USERNAME" --password-file "$password_file" /dist/*.shell-extension.zip
            '
