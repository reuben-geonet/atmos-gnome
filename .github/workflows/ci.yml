name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install GNOME extension tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell python3-venv

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir dist extension/atmos-vpn@reuben-geonet.github.io

      - name: Upload extension artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: atmos-gnome-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  shexli:
    name: Shexli static analysis
    runs-on: ubuntu-latest
    needs: pack

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: atmos-gnome-extension
          path: dist

      - name: Install Shexli
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip shexli

      - name: Run Shexli static analysis
        run: |
          . .venv/bin/activate
          shexli dist/*.shell-extension.zip
