name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    name: Pack extension
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Install GNOME extension tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell python3-venv

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir dist extension/atmos-vpn@reuben-geonet.github.io

      - name: Upload extension artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: atmos-gnome-extension
          path: dist/*.shell-extension.zip
          if-no-files-found: error

  shexli:
    name: Shexli static analysis
    runs-on: ubuntu-latest
    needs: pack

    steps:
      - name: Download extension artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: atmos-gnome-extension
          path: dist

      - name: Install Shexli
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip shexli

      - name: Run Shexli static analysis
        run: |
          . .venv/bin/activate
          shexli dist/*.shell-extension.zip
