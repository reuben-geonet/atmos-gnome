name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Pack and analyze
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-shell python3-venv

      - name: Pack extension
        run: |
          mkdir -p dist
          gnome-extensions pack --force --out-dir dist extension/atmos-toggle@reubena.local

      - name: Run Shexli
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -U pip shexli
          shexli dist/*.shell-extension.zip
